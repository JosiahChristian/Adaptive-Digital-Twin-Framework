name: Experiment 122 Third-Population Reconstruction

on:
  push:
    branches: [main]
    paths:
      - experiments/prospective_support_reconstruction_111_150.py
      - .github/workflows/experiment-122.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment-122-main
  cancel-in-progress: false

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install numpy scikit-learn

      - name: Run Experiment 122
        run: |
          python -m experiments.prospective_support_reconstruction_111_150             2>&1 | tee results/experiment_122_console_output.txt

      - uses: actions/upload-artifact@v4
        with:
          name: experiment-122-results
          path: |
            results/prospective_action_conditioned_support_representation*_111_150.csv
            results/experiment_122_console_output.txt

      - name: Commit synchronized results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective_action_conditioned_support_representation*_111_150.csv
          git add results/experiment_122_console_output.txt
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Run Experiment 122 third-population reconstruction"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Experiment 123 Frozen Cross-Population Transfer

on:
  push:
    branches: [main]
    paths:
      - "experiments/frozen_cross_population_action_harm_transfer.py"
      - ".github/workflows/experiment-123.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment-123:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen transfer test
        run: |
          python -m experiments.frozen_cross_population_action_harm_transfer 2>&1 | tee results/experiment_123_console_output.txt
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: experiment-123-frozen-transfer
          path: |
            results/frozen_cross_population_action_harm_transfer.csv
            results/frozen_cross_population_action_harm_transfer_bootstrap.csv
            results/frozen_cross_population_action_harm_transfer_coefficients.csv
            results/experiment_123_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/frozen_cross_population_action_harm_transfer.csv
          git add results/frozen_cross_population_action_harm_transfer_bootstrap.csv
          git add results/frozen_cross_population_action_harm_transfer_coefficients.csv
          git add results/experiment_123_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 123 frozen cross-population transfer"
          git push

name: Experiment 124 Cross-Population Drift Audit

on:
  push:
    branches: [main]
    paths:
      - "experiments/cross_population_action_harm_drift_audit.py"
      - ".github/workflows/experiment-124.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment-124:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn
      - name: Run drift audit
        run: |
          python -m experiments.cross_population_action_harm_drift_audit 2>&1 | tee results/experiment_124_console_output.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experiment-124-drift-audit
          path: |
            results/cross_population_action_harm_drift_audit.csv
            results/cross_population_action_harm_drift_by_action.csv
            results/experiment_124_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/cross_population_action_harm_drift_audit.csv
          git add results/cross_population_action_harm_drift_by_action.csv
          git add results/experiment_124_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 124 cross-population drift audit"
          git push

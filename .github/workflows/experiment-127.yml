name: Experiment 127 Preregistered Fourth-Population Transfer
on:
  push:
    branches: [main]
    paths:
      - "results/prospective_action_conditioned_support_representation_actions_151_190.csv"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-127:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run preregistered transfer
        run: python -m experiments.preregistered_fourth_population_action_aware_transfer 2>&1 | tee results/experiment_127_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-127-preregistered-transfer
          path: |
            results/preregistered_fourth_population_action_aware_transfer.csv
            results/preregistered_fourth_population_action_aware_transfer_bootstrap.csv
            results/experiment_127_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_fourth_population_action_aware_transfer.csv results/preregistered_fourth_population_action_aware_transfer_bootstrap.csv results/experiment_127_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 127 preregistered fourth-population transfer"
          git push

name: Experiment 130 Fifth-Population Reconstruction
on:
  push:
    branches: [main]
    paths:
      - "experiments/prospective_support_reconstruction_191_230.py"
      - ".github/workflows/experiment-130.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-130:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip numpy scikit-learn
      - name: Reconstruct fifth population
        run: python -m experiments.prospective_support_reconstruction_191_230 2>&1 | tee results/experiment_130_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-130-fifth-population
          path: |
            results/prospective_action_conditioned_support_representation_191_230.csv
            results/prospective_action_conditioned_support_representation_folds_191_230.csv
            results/prospective_action_conditioned_support_representation_actions_191_230.csv
            results/prospective_action_conditioned_support_representation_coefficients_191_230.csv
            results/experiment_130_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective_action_conditioned_support_representation_191_230.csv
          git add results/prospective_action_conditioned_support_representation_folds_191_230.csv
          git add results/prospective_action_conditioned_support_representation_actions_191_230.csv
          git add results/prospective_action_conditioned_support_representation_coefficients_191_230.csv
          git add results/experiment_130_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 130 fifth-population reconstruction"
          git pull --rebase origin main
          git push

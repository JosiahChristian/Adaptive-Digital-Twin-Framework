name: Experiment 134 Preregistered Sixth-Population EM
on:
  push:
    branches: [main]
    paths:
      - "results/prospective_action_conditioned_support_representation_actions_231_270.csv"
      - ".github/workflows/experiment-134.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-134:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.preregistered_sixth_population_unlabeled_em 2>&1 | tee results/experiment_134_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-134-unlabeled-em
          path: |
            results/preregistered_sixth_population_unlabeled_em.csv
            results/experiment_134_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_sixth_population_unlabeled_em.csv results/experiment_134_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 134 unlabeled EM confirmation"
          git pull --rebase origin main
          git push

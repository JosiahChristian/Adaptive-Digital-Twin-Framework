name: Experiment 135 Conservative Alert Rule
on:
  push:
    branches: [main]
    paths:
      - "experiments/conservative_alert_rule_stability.py"
      - ".github/workflows/experiment-135.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-135:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.conservative_alert_rule_stability 2>&1 | tee results/experiment_135_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-135-alert-rule
          path: |
            results/conservative_alert_rule_stability.csv
            results/conservative_alert_rule_stability_by_action.csv
            results/experiment_135_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/conservative_alert_rule_stability.csv results/conservative_alert_rule_stability_by_action.csv results/experiment_135_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 135 conservative alert-rule audit"
          git pull --rebase origin main
          git push

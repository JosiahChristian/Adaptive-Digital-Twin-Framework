name: Experiment 137 Preregistered Fixed-Coverage Alert
on:
  push:
    branches: [main]
    paths:
      - "results/prospective_action_conditioned_support_representation_actions_271_310.csv"
      - ".github/workflows/experiment-137.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-137:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.preregistered_seventh_population_fixed_coverage_alert 2>&1 | tee results/experiment_137_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-137-fixed-coverage-alert
          path: |
            results/preregistered_seventh_population_fixed_coverage_alert.csv
            results/preregistered_seventh_population_fixed_coverage_alert_by_action.csv
            results/preregistered_seventh_population_fixed_coverage_alert_cluster_bootstrap.csv
            results/experiment_137_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_seventh_population_fixed_coverage_alert.csv
          git add results/preregistered_seventh_population_fixed_coverage_alert_by_action.csv
          git add results/preregistered_seventh_population_fixed_coverage_alert_cluster_bootstrap.csv
          git add results/experiment_137_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 137 fixed-coverage alert confirmation"
          git pull --rebase origin main
          git push

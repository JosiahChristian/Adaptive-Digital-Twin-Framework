name: Experiment 138 Action-Identity Negative Control
on:
  push:
    branches: [main]
    paths:
      - "experiments/action_identity_matched_coverage_negative_control.py"
      - ".github/workflows/experiment-138.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-138:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.action_identity_matched_coverage_negative_control 2>&1 | tee results/experiment_138_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-138-negative-control
          path: |
            results/action_identity_matched_coverage_negative_control.csv
            results/action_identity_matched_coverage_random_trials.csv
            results/experiment_138_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/action_identity_matched_coverage_negative_control.csv results/action_identity_matched_coverage_random_trials.csv results/experiment_138_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 138 action-identity negative control"
          git pull --rebase origin main
          git push

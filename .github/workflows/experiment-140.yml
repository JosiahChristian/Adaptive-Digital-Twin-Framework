name: Experiment 140 Preregistered Context Negative Control
on:
  push:
    branches: [main]
    paths:
      - "results/prospective_action_conditioned_support_representation_actions_311_350.csv"
      - ".github/workflows/experiment-140.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-140:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.preregistered_eighth_population_context_negative_control 2>&1 | tee results/experiment_140_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-140-context-negative-control
          path: |
            results/preregistered_eighth_population_context_negative_control.csv
            results/preregistered_eighth_population_matched_random_trials.csv
            results/experiment_140_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_eighth_population_context_negative_control.csv results/preregistered_eighth_population_matched_random_trials.csv results/experiment_140_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 140 context negative-control confirmation"
          git pull --rebase origin main
          git push

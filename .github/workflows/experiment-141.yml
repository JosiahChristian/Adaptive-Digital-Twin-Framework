name: Experiment 141 Frozen Ninth Population Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-141.yml"
permissions:
  contents: write
jobs:
  experiment-141:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.prospective_support_reconstruction_351_390 2>&1 | tee results/experiment_141_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-141-ninth-population
          path: |
            results/prospective_action_conditioned_support_representation_351_390.csv
            results/prospective_action_conditioned_support_representation_folds_351_390.csv
            results/prospective_action_conditioned_support_representation_actions_351_390.csv
            results/prospective_action_conditioned_support_representation_coefficients_351_390.csv
            results/experiment_141_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective_action_conditioned_support_representation_351_390.csv results/prospective_action_conditioned_support_representation_folds_351_390.csv results/prospective_action_conditioned_support_representation_actions_351_390.csv results/prospective_action_conditioned_support_representation_coefficients_351_390.csv results/experiment_141_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 141 ninth-population reconstruction"
          git pull --rebase origin main
          git push

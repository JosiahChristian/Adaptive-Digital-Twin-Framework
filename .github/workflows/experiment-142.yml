name: Experiment 142 Preregistered Incremental Context Ablation
on:
  push:
    branches: [main]
    paths:
      - "results/prospective_action_conditioned_support_representation_actions_351_390.csv"
      - ".github/workflows/experiment-142.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-142:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - run: python -m experiments.preregistered_ninth_population_incremental_context 2>&1 | tee results/experiment_142_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-142-incremental-context
          path: |
            results/preregistered_ninth_population_incremental_context.csv
            results/preregistered_ninth_population_incremental_context_by_seed.csv
            results/preregistered_ninth_population_incremental_context_bootstrap.csv
            results/experiment_142_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_ninth_population_incremental_context.csv results/preregistered_ninth_population_incremental_context_by_seed.csv results/preregistered_ninth_population_incremental_context_bootstrap.csv results/experiment_142_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 142 incremental-context ablation"
          git pull --rebase origin main
          git push

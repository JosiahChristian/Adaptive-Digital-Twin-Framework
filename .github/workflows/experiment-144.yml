name: Experiment 144 Preregistered Conditional Context Permutation
on:
  workflow_run:
    workflows: ["Experiment 143 Frozen Tenth Population Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-144:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 144 analysis
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_tenth_population_conditional_context_permutation 2>&1 | tee results/experiment_144_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-144-conditional-context-permutation
          path: |
            results/preregistered_tenth_population_conditional_context_permutation.csv
            results/preregistered_tenth_population_conditional_context_permutation_trials.csv
            results/experiment_144_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_tenth_population_conditional_context_permutation.csv results/preregistered_tenth_population_conditional_context_permutation_trials.csv results/experiment_144_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 144 conditional-context permutation control"
          git pull --rebase origin main
          git push

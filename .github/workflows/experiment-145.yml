name: Experiment 145 Frozen Eleventh Population Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-145.yml"
permissions:
  contents: write
jobs:
  experiment-145:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 145 reconstruction
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.prospective_support_reconstruction_431_470 2>&1 | tee results/experiment_145_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-145-eleventh-population
          path: |
            results/prospective_action_conditioned_support_representation_431_470.csv
            results/prospective_action_conditioned_support_representation_folds_431_470.csv
            results/prospective_action_conditioned_support_representation_actions_431_470.csv
            results/prospective_action_conditioned_support_representation_coefficients_431_470.csv
            results/experiment_145_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective_action_conditioned_support_representation_431_470.csv results/prospective_action_conditioned_support_representation_folds_431_470.csv results/prospective_action_conditioned_support_representation_actions_431_470.csv results/prospective_action_conditioned_support_representation_coefficients_431_470.csv results/experiment_145_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 145 eleventh-population reconstruction"
          git pull --rebase origin main
          git push

name: Experiment 146 Preregistered Hazard Filter Intervention
on:
  workflow_run:
    workflows: ["Experiment 145 Frozen Eleventh Population Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-146:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 146 intervention
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_eleventh_population_hazard_filter_intervention 2>&1 | tee results/experiment_146_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-146-hazard-filter-intervention
          path: |
            results/preregistered_eleventh_population_hazard_filter_intervention.csv
            results/preregistered_eleventh_population_hazard_filter_random_trials.csv
            results/preregistered_eleventh_population_hazard_filter_by_seed.csv
            results/experiment_146_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_eleventh_population_hazard_filter_intervention.csv results/preregistered_eleventh_population_hazard_filter_random_trials.csv results/preregistered_eleventh_population_hazard_filter_by_seed.csv results/experiment_146_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 146 hazard-filter intervention"
          git pull --rebase origin main
          git push

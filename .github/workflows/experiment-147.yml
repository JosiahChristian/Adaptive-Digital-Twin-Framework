name: Experiment 147 Frozen Twelfth Population Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-147.yml"
permissions:
  contents: write
jobs:
  experiment-147:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 147 reconstruction
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.prospective_support_reconstruction_471_510 2>&1 | tee results/experiment_147_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-147-twelfth-population
          path: |
            results/prospective_action_conditioned_support_representation_471_510.csv
            results/prospective_action_conditioned_support_representation_folds_471_510.csv
            results/prospective_action_conditioned_support_representation_actions_471_510.csv
            results/prospective_action_conditioned_support_representation_coefficients_471_510.csv
            results/experiment_147_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective_action_conditioned_support_representation_471_510.csv results/prospective_action_conditioned_support_representation_folds_471_510.csv results/prospective_action_conditioned_support_representation_actions_471_510.csv results/prospective_action_conditioned_support_representation_coefficients_471_510.csv results/experiment_147_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 147 twelfth-population reconstruction"
          git pull --rebase origin main
          git push

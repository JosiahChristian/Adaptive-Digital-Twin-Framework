name: Experiment 148 Preregistered Intervention Replication
on:
  workflow_run:
    workflows: ["Experiment 147 Frozen Twelfth Population Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-148:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 148 replication
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_twelfth_population_intervention_replication 2>&1 | tee results/experiment_148_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-148-intervention-replication
          path: |
            results/preregistered_twelfth_population_intervention_replication.csv
            results/preregistered_twelfth_population_intervention_replication_random_trials.csv
            results/preregistered_twelfth_population_intervention_replication_by_seed.csv
            results/experiment_148_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_twelfth_population_intervention_replication.csv results/preregistered_twelfth_population_intervention_replication_random_trials.csv results/preregistered_twelfth_population_intervention_replication_by_seed.csv results/experiment_148_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 148 intervention replication"
          git pull --rebase origin main
          git push

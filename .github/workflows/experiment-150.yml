name: Experiment 150 Preregistered Training Label Poisoning Stress Test
on:
  workflow_run:
    workflows: ["Experiment 149 Frozen Thirteenth Population Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-150:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 150 poisoning stress test
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_training_label_poisoning_stress_test 2>&1 | tee results/experiment_150_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-150-training-label-poisoning
          path: |
            results/preregistered_training_label_poisoning_stress_test.csv
            results/preregistered_training_label_poisoning_random_trials.csv
            results/experiment_150_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_training_label_poisoning_stress_test.csv results/preregistered_training_label_poisoning_random_trials.csv results/experiment_150_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 150 training-label poisoning stress test"
          git pull --rebase origin main
          git push

name: Experiment 151 Preregistered Context-Tail Label-Audit Mitigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experiment-151.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  experiment-151:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 151 mitigation
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_context_tail_label_audit_mitigation | tee results/experiment_151_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-151-results
          path: |
            results/preregistered_context_tail_label_audit_mitigation.csv
            results/preregistered_context_tail_label_audit_random_trials.csv
            results/experiment_151_console_output.txt
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/preregistered_context_tail_label_audit_mitigation.csv results/preregistered_context_tail_label_audit_random_trials.csv results/experiment_151_console_output.txt
          git diff --cached --quiet || git commit -m 'Run Experiment 151 context-tail label-audit mitigation'
          git push

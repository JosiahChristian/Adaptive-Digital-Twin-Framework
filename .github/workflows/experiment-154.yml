name: Experiment 154 Poisoning-Benefit Diagnostic
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/experiment-154.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-154:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run Experiment 154 diagnostic
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.poisoning_benefit_diagnostic 2>&1 | tee results/experiment_154_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-154-diagnostic
          path: |
            results/poisoning_benefit_diagnostic.csv
            results/poisoning_benefit_diagnostic_context_changes.csv
            results/experiment_154_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/poisoning_benefit_diagnostic.csv results/poisoning_benefit_diagnostic_context_changes.csv results/experiment_154_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 154 poisoning-benefit diagnostic"
          git pull --rebase origin main
          git push

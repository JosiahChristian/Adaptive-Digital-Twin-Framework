name: Experiment 156 Prospective Poisoning Boundary Replication
on:
  workflow_run:
    workflows: ["Experiment 155 Fresh Fifteenth Population Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-156:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen prospective replication
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.prospective_poisoning_boundary_replication 2>&1 | tee results/experiment_156_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-156-boundary-replication
          path: |
            results/prospective_poisoning_boundary_replication.csv
            results/prospective_poisoning_boundary_replication_context_changes.csv
            results/experiment_156_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/prospective_poisoning_boundary_replication.csv results/prospective_poisoning_boundary_replication_context_changes.csv results/experiment_156_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 156 prospective poisoning-boundary replication"
          git pull --rebase origin main
          git push

name: Experiment 158 Preregistered Prediction-Decision Divergence
on:
  workflow_run:
    workflows: ["Experiment 157 Prediction-Decision Divergence Target Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-158:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen prediction-decision divergence evaluation
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_prediction_decision_divergence 2>&1 | tee results/experiment_158_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-158-divergence
          path: |
            results/preregistered_prediction_decision_divergence.csv
            results/experiment_158_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_prediction_decision_divergence.csv results/experiment_158_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 158 prediction-decision divergence"
          git pull --rebase origin main
          git push

name: Experiment 161 Preregistered Seed-Level Prediction-Decision Coupling
on:
  workflow_run:
    workflows: ["Experiment 160 Seed-Level Coupling Target Reconstruction"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-161:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip numpy pandas scikit-learn
      - name: Run frozen Experiment 161 coupling analysis
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_seed_level_prediction_decision_coupling 2>&1 | tee results/experiment_161_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-161-seed-level-coupling
          path: |
            results/preregistered_seed_level_prediction_decision_coupling.csv
            results/preregistered_seed_level_prediction_decision_coupling_by_seed.csv
            results/preregistered_seed_level_prediction_decision_coupling_bootstrap.csv
            results/experiment_161_console_output.txt
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/preregistered_seed_level_prediction_decision_coupling.csv results/preregistered_seed_level_prediction_decision_coupling_by_seed.csv results/preregistered_seed_level_prediction_decision_coupling_bootstrap.csv results/experiment_161_console_output.txt
          git diff --cached --quiet || git commit -m "Run Experiment 161 seed-level prediction-decision coupling"
          git pull --rebase origin main
          git push

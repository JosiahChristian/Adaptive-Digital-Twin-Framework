name: Experiment 162 Intervention-Aligned Metric Target Reconstruction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/experiment-162.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiment-162:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn
      - name: Run frozen Experiment 162 reconstruction
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.prospective_support_reconstruction_711_750 2>&1 | tee results/experiment_162_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-162-target
          path: |
            results/prospective_action_conditioned_support_representation_711_750.csv
            results/prospective_action_conditioned_support_representation_folds_711_750.csv
            results/prospective_action_conditioned_support_representation_actions_711_750.csv
            results/prospective_action_conditioned_support_representation_coefficients_711_750.csv
            results/experiment_162_console_output.txt
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/prospective_action_conditioned_support_representation_711_750.csv results/prospective_action_conditioned_support_representation_folds_711_750.csv results/prospective_action_conditioned_support_representation_actions_711_750.csv results/prospective_action_conditioned_support_representation_coefficients_711_750.csv results/experiment_162_console_output.txt
          git diff --cached --quiet || git commit -m 'Run Experiment 162 target reconstruction'
          git pull --rebase origin main
          git push

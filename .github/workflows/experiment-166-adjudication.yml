name: Experiment 166 Cutoff Geometry Adjudication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experiment-166-adjudication.yml'
permissions:
  contents: write
jobs:
  experiment-166-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn statsmodels
      - name: Run frozen Experiment 166 adjudication
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.preregistered_cutoff_geometry_mechanism 2>&1 | tee results/experiment_166_adjudication_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-166-adjudication
          path: |
            results/preregistered_cutoff_geometry_mechanism.csv
            results/preregistered_cutoff_geometry_mechanism_by_seed.csv
            results/preregistered_cutoff_geometry_mechanism_rows.csv
            results/preregistered_cutoff_geometry_context_changes.csv
            results/experiment_166_adjudication_console_output.txt
      - name: Commit adjudication results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/preregistered_cutoff_geometry_mechanism.csv results/preregistered_cutoff_geometry_mechanism_by_seed.csv results/preregistered_cutoff_geometry_mechanism_rows.csv results/preregistered_cutoff_geometry_context_changes.csv results/experiment_166_adjudication_console_output.txt
          git diff --cached --quiet || git commit -m 'Run Experiment 166 cutoff-geometry adjudication'
          git pull --rebase origin main
          git push

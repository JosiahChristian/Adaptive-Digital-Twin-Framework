name: Experiment 166 Cutoff Geometry Target Reconstruction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/experiment-166.yml'
permissions:
  contents: write
jobs:
  experiment-166:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pip numpy pandas scipy scikit-learn statsmodels
      - name: Run frozen Experiment 166 reconstruction
        shell: bash
        run: |
          set -o pipefail
          python -m experiments.prospective_support_reconstruction_791_830 2>&1 | tee results/experiment_166_console_output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-166-target
          path: |
            results/prospective_action_conditioned_support_representation_791_830.csv
            results/prospective_action_conditioned_support_representation_folds_791_830.csv
            results/prospective_action_conditioned_support_representation_actions_791_830.csv
            results/prospective_action_conditioned_support_representation_coefficients_791_830.csv
            results/experiment_166_console_output.txt
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/prospective_action_conditioned_support_representation_791_830.csv results/prospective_action_conditioned_support_representation_folds_791_830.csv results/prospective_action_conditioned_support_representation_actions_791_830.csv results/prospective_action_conditioned_support_representation_coefficients_791_830.csv results/experiment_166_console_output.txt
          git diff --cached --quiet || git commit -m 'Run Experiment 166 cutoff-geometry target reconstruction'
          git pull --rebase origin main
          git push

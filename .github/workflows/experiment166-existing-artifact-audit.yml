name: Experiment 166 Existing-Artifact Audit

on:
  push:
    paths:
      - 'research/audit/experiment_166_existing_artifact_adjudication.py'
      - '.github/workflows/experiment166-existing-artifact-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy

      - name: Execute frozen existing-artifact adjudication
        run: python research/audit/experiment_166_existing_artifact_adjudication.py

      - name: Upload audit-only outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment166-existing-artifact-audit
          path: audit_outputs/
          if-no-files-found: error

name: Experiment 166 Matched Non-Poison Control

on:
  push:
    paths:
      - '.github/workflows/experiment166-matched-nonpoison-control.yml'
      - 'research/audit/experiment_166_matched_nonpoison_control.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install control dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scikit-learn
      - name: Execute frozen matched non-poison control
        run: python research/audit/experiment_166_matched_nonpoison_control.py
      - name: Upload audit-only control outputs
        uses: actions/upload-artifact@v4
        with:
          name: experiment166-matched-nonpoison-control
          path: results/audit/experiment_166_matched_nonpoison_control/
          if-no-files-found: error
